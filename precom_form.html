<html lang="fa" dir="rtl"><head><meta charset="utf-8">

<title>precom_form</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#14213d;--mut:#667085;--line:#e4e7ef;--acc:#e8590c;--acc2:#1c7ed6;--ok:#2f9e44;--sh:0 6px 24px rgba(20,33,61,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#192033;--ink:#eef1f8;--mut:#9aa4bd;--line:#2a3350;--acc:#ff922b;--acc2:#74c0fc;--ok:#69db7c;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#192033;--ink:#eef1f8;--mut:#9aa4bd;--line:#2a3350;--acc:#ff922b;--acc2:#74c0fc;--ok:#69db7c;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;line-height:1.7}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,#14213d,#1c4e80 60%,#e8590c);color:#fff;border-radius:22px;padding:26px 22px;box-shadow:var(--sh)}
.hero small{opacity:.8;letter-spacing:.5px}.hero h1{margin:4px 0 6px;font-size:26px;font-weight:800}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.stat{background:rgba(255,255,255,.14);border-radius:14px;padding:8px 14px;font-size:14px}.stat b{font-size:20px;display:block}
.search{width:100%;margin:16px 0;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;box-shadow:var(--sh);border-top:5px solid var(--c);transition:transform .15s}
.card:active,.card:hover{transform:translateY(-3px)}
.card .ic{font-size:30px}.card h3{margin:6px 0 2px;font-size:16px}.card .en{color:var(--mut);font-size:12px;direction:ltr;text-align:right}
.badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--bg);color:var(--mut);margin-top:8px}
.back{background:none;border:0;color:var(--acc2);font:inherit;font-size:15px;cursor:pointer;padding:8px 0}
.sec-h{display:flex;align-items:center;gap:12px;margin:6px 0 14px}.sec-h .ic{font-size:38px}.sec-h h2{margin:0;font-size:21px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.row:hover{border-color:var(--acc)}
.code{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;background:var(--bg);color:var(--acc);padding:3px 9px;border-radius:8px;white-space:nowrap}
.nm{flex:1;direction:ltr;unicode-bidi:isolate;text-align:left;font-size:15px}.pg{color:var(--mut);font-size:12px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}.dot.on{background:var(--ok)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.empty{text-align:center;padding:30px 12px;color:var(--mut)}.empty .big{font-size:46px}
.subs{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.subs li{background:var(--bg);border-radius:99px;padding:2px 12px;font-size:12.5px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px dashed var(--line);direction:ltr;text-align:left}
.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok)}
.bar{height:10px;background:var(--bg);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--ok);width:0}
.h2{font-size:15px;color:var(--mut);margin:18px 0 8px}

:root{--paper:#fff;--pink:#111}
.sheet{background:var(--paper);color:var(--pink);direction:ltr;text-align:left;border:1px solid #cfd4e0;border-radius:8px;padding:22px;font-family:Arial,Helvetica,sans-serif;font-size:14px;box-shadow:var(--sh)}
.sheet h2{margin:2px 0 10px;font-size:20px}.sheet .s1{color:#555;font-size:13px;text-transform:uppercase;letter-spacing:.6px}
.sheet .fc{background:#111;color:#fff;padding:2px 9px;border-radius:5px;font-size:15px;margin-right:8px}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;margin:12px 0 16px}.hg label{font-size:12px;color:#444;display:block}
.hg input,.sheet .ln,.sheet textarea{border:0;border-bottom:1px solid #666;background:transparent;color:var(--pink);font:inherit;width:100%;padding:3px 2px;border-radius:0}
.sheet textarea{border:1px solid #666;min-height:70px;padding:6px}
.it{width:100%;border-collapse:collapse}.it th,.it td{border:1px solid #888;padding:6px 8px;vertical-align:middle}.it th{background:#e9ecf3;font-size:12px}
.it .n{width:38px;text-align:center}.it .st{white-space:nowrap;width:128px;text-align:center}
.sb{border:1px solid #666;background:#fff;color:#111;width:34px;height:28px;margin:0 1px;font-weight:700;cursor:pointer;font-size:12px}.sb.on{background:#111;color:#fff}
.leg{font-size:11.5px;color:#555;margin:6px 0 12px}
.fl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:5px 0;border-bottom:1px dotted #bbb}.fl .lb{font-weight:600}.fl .ln{flex:1;min-width:90px;width:auto}.yn{white-space:nowrap}
.sh{background:#e9ecf3;margin:14px 0 6px;padding:4px 8px;font-size:13px;letter-spacing:.4px}
.sig{width:100%;border-collapse:collapse;margin-top:14px}.sig td{border:1px solid #888;padding:10px;height:34px}.sig td:first-child{width:110px;font-weight:600}
.pn{font-size:11px;color:#777;text-align:right;margin:10px 0 4px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.btn{background:var(--acc2);color:#fff;border:0;border-radius:12px;padding:9px 18px;font:inherit;cursor:pointer}.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--line)}
@page{size:A4;margin:12mm}
@media print{:root{color-scheme:light}body{background:#fff}.wrap{max-width:none;padding:0}.noprint,.back{display:none!important}.sheet{box-shadow:none;border:0;padding:0;border-radius:0}.pgsec{break-after:page}.pgsec:last-of-type{break-after:auto}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.sb:not(.on){color:#999}body.nopr #app{display:none}body.nopr::before{content:"چاپ فقط در صفحهٔ چک‌لیست فعال است";display:block;padding:30px;font-size:18px}}
.note{margin-top:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:8px 14px;font-size:12.5px}
@media(max-width:560px){.hg{grid-template-columns:1fr}.sheet{padding:14px}}

function lineHtml(cells,k,code){

async function printForm(code){

   if(e.type==="checkbox"){s.textContent=(o.checked?"\u2612 ":"\u2610 ")+e.parentNode.textContent.trim();e.parentNode.replaceWith(s);return}
   if(e.tagName==="TEXTAREA")s.style.cssText="border:1px solid #666;min-height:70px;padding:6px;white-space:pre-wrap";
   else s.style.cssText="display:block;flex:1;min-width:90px;min-height:20px;border-bottom:1px solid #666;padding:3px 2px";
   s.textContent=o.value;e.replaceWith(s)});
  host.appendChild(c);document.body.appendChild(host);
  const cv=await html2canvas(c,{scale:2,backgroundColor:"#fff",logging:false});
  const top=c.getBoundingClientRect().top,H=c.getBoundingClientRect().height,ph=277*W/190,k=cv.width/W;
  const cuts=[...c.querySelectorAll("tr,.fl,.sh,.hg,.pn,.sig,div[style*='min-height:70px']")].map(e=>e.getBoundingClientRect().bottom-top).sort((a,b)=>a-b);
  const pages=[];let y=0;while(y<H-1){let end=H;if(y+ph<H){end=y+ph;const ok=cuts.filter(v=>v>y+ph*.4&&v<=y+ph);if(ok.length)end=ok[ok.length-1]}pages.push([y,end]);y=end}
  const pdf=new jspdf.jsPDF({unit:"mm",format:"a4"});
  pages.forEach(([a,e],i)=>{const s=document.createElement("canvas");s.width=cv.width;s.height=Math.max(1,Math.round((e-a)*k));const g=s.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,s.width,s.height);g.drawImage(cv,0,Math.round(a*k),cv.width,s.height,0,0,cv.width,s.height);if(i)pdf.addPage();pdf.addImage(s.toDataURL("image/jpeg",.92),"JPEG",10,10,190,(e-a)*190/W);pdf.setFontSize(8);pdf.setTextColor(120);pdf.text(code+" \u00b7 GS EP EXP 105 \u00b7 "+(i+1)+"/"+pages.length,200,291,{align:"right"})});
  host.remove();host=null;
  await dl.save({filename:code+".pdf",data:pdf.output("blob")});
 }catch(err){if(host)host.remove();if(!err||err.code!=="declined")alert("ساخت PDF ممکن نشد؛ از «پرینت مرورگر» استفاده کنید.")}
 finally{b.textContent=old;b.disabled=false}
}
